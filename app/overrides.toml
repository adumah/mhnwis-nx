# sub_82678F88: the table jump at 0x826790B4 indexes a byte table at 0x8239B868 with r10 = r9 & 0x3F
# (rlwinm r10,r9,0,26,31 at 0x8267908C), target = 0x826790B8 + byte*4. tools/switch_check.py took the mask as a
# bound of 64, but only the first 12 bytes are offsets (9 cases, then 3 zero bytes = 0x826790B8): from byte 12 on the
# data is float constants (0x3F870A3D = 1.055f, 0x414EB852 = 12.92f, sRGB), whose "targets" land in the next
# functions (sub_82679228, sub_826792B0, sub_82679350: real mflr r12 prologues). The generator's own 17 cases
# included one such target (0x826792D4). 12 labels, all inside the function (2026-10-20).
[[switch_tables]]
address = 0x826790B4
register = 10
labels = [
    0x8267913C, 0x82679148, 0x82679154, 0x82679160, 0x8267916C, 0x82679178, 0x82679184, 0x82679190,
    0x826791A0, 0x826790B8, 0x826790B8, 0x826790B8,
]
