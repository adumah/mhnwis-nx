# Monster High: New Ghoul in School-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). Candidate tools in sa2-nx/tools:
#   find_gaps.py, gap_fixpoint.py      code the automatic discovery left without a function
#   pointer_fixpoint.py, pointer_audit.py  code pointers stored in data (vtables, callback tables)
#   switch_check.py                    truncated jump tables

# The CRT's setjmp/longjmp (root keys: they must stay outside any table), found by shape in .text (2026-10-20,
# before the first boot; same jmp_buf layout as SA2's CRT pair). Recompiled as plain calls, longjmp would return to
# its caller with the setjmp frame's r1/r31.
#   setjmp  0x82BA1910: hook check (lis r4 / lwz / mtctr / bnectr), mflr r0, mfcr r4, then stfd f14-f31 at 0-136(r3),
#           std r13-r31 at 152-296(r3), stvx128 v0.. from 320(r3)
#   longjmp 0x82BA1290: mflr r0, stwu r1,-80(r1), mr r7,r3, val==0 check, then the mirror loads lfd f14-f31 /
#           ld r13-r31 at the same offsets of r7
setjmp_address = 0x82BA1910
longjmp_address = 0x82BA1290

