# Shared tails reached by a conditional branch from the next function ("Unresolved conditional branch", codegen
# 2026-10-20; emitted as REX_FATAL). As function starts the generator emits a conditional tail call instead (checked
# in the generated code: `if (cr6...) { sub_X(ctx, base); return; }`). Both end in blr.
#   0x829A3940: lis/ori r3 = 0x80004005 (E_FAIL), blr. Reads no register. The code before it, 0x829A3938-0x829A393C
#     (cmplw cr6 / ble to 0x829A394C), stays a 20-byte gap after sub_829A3200 (which ends with b at 0x829A3934): no
#     pointer, bl/b or pdata entry reaches 0x829A3938 or sub_829A394C.
#   0x82AF87FC: mr r3,r11, blr. Reads r11 (volatile): its only caller loads r11 = [r3+172] right before the bne, and
#     the classic codegen keeps r11 in ctx across the call. Re-check with share_registers if the register-locals
#     flavour (perf_overrides) is ever used. The code before it, 0x82AF87F0-0x82AF87F8 (r11 = [r3+168], beq to
#     0x82AF8804), stays a 20-byte gap: no pointer, lis/addi, bl/b or pdata entry reaches 0x82AF87F0, sub_82AF87B8
#     or sub_82AF8804, so all three getters look unreferenced.
"0x829A3940" = { }  # bgt cr6 from 0x829A3968 (sub_829A394C)
"0x82AF87FC" = { }  # bne cr6 from 0x82AF8820 (sub_82AF8804)

